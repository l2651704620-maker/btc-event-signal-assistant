
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BTCEventSignalAssistant_V2.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q BTCEventSignalAssistant_V2.zip

      - name: Build APK
        run: gradle -p BTCEventSignalAssistant_V2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCEventSignalAssistant-APK
          path: BTCEventSignalAssistant_V2/app/build/outputs/apk/debug/app-debug.apk
